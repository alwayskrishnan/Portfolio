<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <rect width="100" height="100" rx="16" fill="#0a0a0a"/>
  <!-- Head -->
  <circle cx="50" cy="24" r="11" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Ear left -->
  <path d="M39 24 Q36 24 36 27 Q36 30 39 30" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- Ear right -->
  <path d="M61 24 Q64 24 64 27 Q64 30 61 30" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- Neck + shoulders -->
  <path d="M44 35 Q44 39 50 39 Q56 39 56 35" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Laptop screen body -->
  <rect x="18" y="44" width="64" height="36" rx="4" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Laptop base bar -->
  <rect x="12" y="80" width="76" height="7" rx="3.5" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Code symbol: < -->
  <polyline points="40,55 31,62 40,69" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Code symbol: > -->
  <polyline points="60,55 69,62 60,69" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Code symbol: / -->
  <line x1="54" y1="53" x2="46" y2="71" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
</svg>
